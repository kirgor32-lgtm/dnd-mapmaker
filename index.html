<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D&D MapMaker — Редактор Карт и Объектов</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<div id="container">
  <canvas id="canvas"></canvas>

  <!-- Top toolbar -->
  <div id="toolbar" class="toolbar">
    <div class="toolbar-group">
      <button id="btnNew" class="btn" title="Новая карта">📄 Новая</button>
      <button id="btnSave" class="btn" title="Сохранить в файл">💾 Сохранить</button>
      <button id="btnLoad" class="btn" title="Загрузить из файла">📂 Загрузить</button>
      <button id="btnExport" class="btn" title="Экспортировать как PNG">🖼️ Экспорт</button>
    </div>
    <div class="toolbar-group">
      <button id="btnUndo" class="btn" title="Отменить (Ctrl+Z)">↶ Отменить</button>
      <button id="btnRedo" class="btn" title="Повторить (Ctrl+Y)">↷ Повторить</button>
    </div>
    <div class="toolbar-group">
      <button id="btnSelectTool" class="btn toggle" title="Выбрать/двигать/повернуть/удалить объект">🖱️ Выбрать</button>
      <button id="btnRotate" class="btn" title="Повернуть выбранный объект (R)">↻ Повернуть</button>
      <button id="btnDelete" class="btn" title="Удалить выбранный объект (Del)">🗑️ Удалить</button>
    </div>
    <div class="toolbar-group">
      <button id="btnGrid" class="btn toggle" title="Включить/выключить сетку">⊞ Сетка</button>
      <button id="btnSnap" class="btn toggle" title="Привязать к сетке">🧲 Привязка</button>
    </div>
    <div class="toolbar-group">
      <label class="mode-label">Режим: 
        <select id="modeSelector" title="Выбрать режим">
          <option value="town">Город</option>
          <option value="dungeon">Подземелье</option>
        </select>
      </label>
    </div>
  </div>

  <!-- Left sidebar: Terrain brushes -->
  <aside id="leftPanel" class="left-panel">
    <div class="panel-header">Террейн</div>
    <div class="brush-section">
      <label class="fld">Размер кисти</label>
      <div class="brush-size-row">
        <input id="brushSize" type="range" min="5" max="100" value="20">
        <span id="brushSizeLabel" class="size-label">20</span>
      </div>
    </div>
    <div class="terrain-swatches">
      <button class="terrain-btn active" data-terrain="grass" title="Трава">🌱 Трава</button>
      <button class="terrain-btn" data-terrain="forest" title="Лес">🌲 Лес</button>
      <button class="terrain-btn" data-terrain="mountain" title="Гора">⛰️ Гора</button>
      <button class="terrain-btn" data-terrain="water" title="Вода">💧 Вода</button>
      <button class="terrain-btn" data-terrain="sand" title="Песок">🏜️ Песок</button>
      <button class="terrain-btn" data-terrain="snow" title="Снег">❄️ Снег</button>
      <button class="terrain-btn" data-terrain="swamp" title="Болото">🪨 Болото</button>
      <button class="terrain-btn" data-terrain="road" title="Дорога">🛣️ Дорога</button>
      <button class="terrain-btn" data-terrain="dungeon" title="Камень">🧱 Камень</button>
      <button class="terrain-btn" data-terrain="wall" title="Стена">🚪 Стена</button>
    </div>
  </aside>

  <!-- Right sidebar: Props palette -->
  <aside id="rightPanel" class="right-panel">
    <div class="panel-header">Объекты и Постройки</div>
    <div class="palette-controls">
      <input id="propFilter" type="text" placeholder="Поиск..." class="filter-box">
    </div>
    <div class="palette-tabs">
      <button class="palette-tab active" data-tab="town">Город</button>
      <button class="palette-tab" data-tab="dungeon">Подземелье</button>
      <button class="palette-tab" data-tab="nature">Природа</button>
    </div>
    <div id="propPalette" class="prop-palette">
      <!-- Динамически заполняется JS -->
    </div>
  </aside>

  <!-- Bottom status bar -->
  <div id="statusBar" class="status-bar">
    <div class="status-item">Масштаб: <span id="zoomLevel">100%</span></div>
    <div class="status-item">Координаты: <span id="gridCoords">—</span></div>
    <div class="status-item">Режим: <span id="modeStatus">Город</span></div>
    <div class="status-item">1 клетка = 5 футов (≈1.5 м)</div>
  </div>
</div>

<!-- New Map Dialog -->
<div id="newMapDialog" class="modal hidden">
  <div class="modal-content">
    <h2>Новая карта</h2>
    <label class="fld">Ширина (ячейки): <input id="mapWidth" type="number" value="50" min="10" max="200"></label>
    <label class="fld">Высота (ячейки): <input id="mapHeight" type="number" value="50" min="10" max="200"></label>
    <div class="modal-buttons">
      <button id="btnCreateMap" class="btn primary">Создать</button>
      <button id="btnCancelMap" class="btn">Отменить</button>
    </div>
  </div>
</div>

<!-- File input for loading -->
<input id="fileInput" type="file" accept=".json" style="display:none;">

<script src="js/app.js?v=7"></script>
</body>
</html>
